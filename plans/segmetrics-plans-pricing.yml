pricing_model_note: >-
  Displayed prices are a function of "active contacts" — the pricing page carries a slider
  ("How many active contacts do you have? Only pay for the people you're actively engaging
  with") which defaults to 30k. The prices recorded below are the published rates AT THE 30,000
  ACTIVE CONTACTS TIER; they rise with the slider. No public rate card enumerating the price at
  each contact band was found, and no overage rate is published — you move to a higher band
  rather than paying an overage.
api_access_gating: >-
  IMPORTANT — programmatic API access is NOT included in every plan. The Scale tier's headline
  benefit is "Advanced Data APIs — Get programmatic access to the reporting and data ingest
  APIs". The plan comparison table lists "Import API Access" and "Reporting API" as separate
  feature rows. A developer therefore cannot reach the Import or Reporting API on the entry
  tier; the MCP Server additionally requires a paid plan on the AI tool itself.
