  - 'GET /{account_id}/report/{report_type}/{report_id}/contacts'
  - 'POST /v2/{account_id}/data/query'
  report_types_documented: [leads, revenue, ads, subscriptions]
  report_types_note: >-
    The REST reference names four report_type values; the MCP server's run-query tool is
