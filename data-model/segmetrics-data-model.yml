  response_shape: 'report{} + kpis[] + graph{labels,datasets} + table{fields[],rows[]}'
- name: CustomField
  note: >-
    Free-form key/value on Contact. Also surfaces as a report dimension — the MCP get-dimensions
    tool is documented as returning "account-specific custom dimensions pulled from your
    integration custom fields".
