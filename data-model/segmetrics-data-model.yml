  - utm_content
  - utm_term
  - referring_url
  - optin_url
  - ip_address
  - affiliate_id
  - geo_lat
  - geo_lon
  - custom_fields
  expansions: [tags, events, orders]
  expansion_param: extend
- name: Tag
  write_endpoints:
  - 'POST /v1/{account_id}/{integration_id}/tags/add'
  - 'POST /v1/{account_id}/{integration_id}/tags/remove'
  fields: [id, tag_id, name, date, date_created, contact_id]
  note: Tags may be supplied inline on a Contact write as ids or as objects with a date.
- name: Order
  aka: Invoice
  write_endpoint: 'POST /v1/{account_id}/{integration_id}/invoice'
  delete_endpoint: 'DELETE /v1/{account_id}/{integration_id}/invoice/{id}'
