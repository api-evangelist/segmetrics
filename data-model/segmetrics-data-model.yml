identifiers:
  account_id:
    description: Tenant identifier; a path segment on every REST call.
    source: SegMetrics Account Settings page
  integration_id:
    description: >-
      Identifies the data source within an account. Required on every Import API write, so the
      same logical contact can exist under multiple integrations.
    source: SegMetrics Account Settings page
  contact_id:
    description: >-
      Customer-supplied external id. Not a SegMetrics-minted id — it is the id from the source
      system. On upsert, contact_id takes priority over email; passing a contact_id for an
      existing email address re-keys that contact to the new id.
  id_prefixes: []
  id_prefixes_note: No typed id prefixes (e.g. cus_/inv_) are used; ids are opaque strings/integers.
entity_count: 8
entities:
- name: Contact
  write_endpoint: 'POST /v1/{account_id}/{integration_id}/contact'
  delete_endpoint: 'DELETE /v1/{account_id}/{integration_id}/contact/{contact_id_or_email}'
  read_endpoint: 'GET /{account_id}/contact/{contact_id_or_email}'
  keys: [contact_id, email]
  fields:
  - first_name
  - last_name
  - email
  - status
  - date_created
  - last_updated
  - utm_source
  - utm_medium
