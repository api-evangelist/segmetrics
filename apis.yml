apis:
- aid: segmetrics-import-api
  name: SegMetrics Import API
  description: >-
    The v1 Import API lets a customer push their own data into a SegMetrics integration —
    contacts (with UTM attribution, geo, affiliate and custom fields), tags, orders/invoices,
    subscriptions, products and ad performance. Writes are upserts keyed on contact_id or email.
    Authenticated with a raw API key in the Authorization header; account_id and integration_id
    are path segments.
  humanURL: https://developers.segmetrics.io/#getting-started
  baseURL: https://import.segmetrics.io/api/v1
  tags:
  - Import
  - Contacts
  - Attribution
  - Marketing
  properties:
  - type: APIReference
    url: https://developers.segmetrics.io/#getting-started
  - type: Authentication
    url: authentication/segmetrics-authentication.yml
- aid: segmetrics-reporting-api
  name: SegMetrics Reporting API
  description: >-
    The Reporting API returns the metrics SegMetrics generates — saved report data (KPIs, graph
    series and a table of fields and rows), a customer-journey export of the contacts behind a
    report, an ad-hoc /v2 data query endpoint that mirrors the in-app Data Explorer, and a
    single-contact read with extend expansions for tags, events and orders.
  humanURL: https://developers.segmetrics.io/#reporting-section
  baseURL: https://api.segmetrics.io
  tags:
  - Reporting
  - Analytics
  - Attribution
  - Query
  properties:
  - type: APIReference
    url: https://developers.segmetrics.io/#reporting-section
  - type: Authentication
    url: authentication/segmetrics-authentication.yml
- aid: segmetrics-mcp-server
  name: SegMetrics MCP Server
  description: >-
    A hosted, read-only Model Context Protocol server that gives Claude, ChatGPT and other MCP
    clients direct access to a SegMetrics account. Eleven tools split into discovery
    (get-account-info, get-metrics, get-dimensions, get-filters, get-products, get-tags,
    get-lists, get-segments, get-traffic-sources) and query (run-query, get-contacts). The
    endpoint is per-tenant — https://app.segmetrics.io/mcp/ACCOUNT_ID — and authorized by OAuth
    against the customer's SegMetrics account.
  humanURL: https://docs.segmetrics.io/article/672-mcp-server
  baseURL: https://app.segmetrics.io/mcp
  tags:
  - MCP
  - Agents
  - Analytics
  - Reporting
  properties:
  - type: MCPServer
    url: mcp/segmetrics-mcp.yml
  - type: Documentation
    url: https://docs.segmetrics.io/article/672-mcp-server
