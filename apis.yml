aid: segmetrics
name: SegMetrics
description: >-
  SegMetrics is a marketing attribution and revenue analytics platform for digital marketers,
  info-product businesses and agencies. It stitches ad clicks, opt-ins, email engagement, calls
  and purchases into a single contact journey so a business can see which traffic sources,
  campaigns and funnels actually produce revenue and lifetime value rather than just clicks. The
  platform connects to 100+ marketing tools (ActiveCampaign, Kit/ConvertKit, ClickFunnels,
  HighLevel, Drip, Ontraport, WooCommerce, Google Ads, Microsoft Advertising and more) and adds
  fingerprint tracking, full-LTV attribution, multi-report tables, custom dashboards and data
  monitors on top. Developers get three public surfaces: a v1 Import API at import.segmetrics.io
  for pushing contacts, tags, orders, subscriptions, products and ad performance into an
  integration; a Reporting API at api.segmetrics.io for saved reports, customer-journey exports
  and ad-hoc /v2 data queries; and a read-only hosted MCP server at app.segmetrics.io/mcp that
  exposes 11 OAuth-protected tools to Claude, ChatGPT and other MCP clients. API access is gated
  to the Scale tier and above.
