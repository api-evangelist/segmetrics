note: >-
  SegMetrics ships NO first-party client library in any public package registry. Every registry
  below was queried unauthenticated on 2026-08-12 and the result is recorded verbatim. The
  SegMetrics GitHub org (github.com/SegMetrics) was also enumerated: it holds 16 public
  repositories, and every one of them is either a fork of a third-party library
  (drip-php, google-ads-php, php-vcr, laravel-collective-html, singlestoredb-laravel-driver,
  twitter-php-ads-sdk, fxmlrpc, geocodio-library-php, laroute, ulid, version, yaml) or an
  internal tool (marketing-scripts, url-shortener) — none is a SegMetrics API client. The one
  API-adjacent repo, segmetrics-dev-docs, is the Slate source behind developers.segmetrics.io,
  not an SDK. Consequently NO `SDKs` pointer is emitted in apis.yml: the sdk_count checks must
  not fire on third-party packages.
