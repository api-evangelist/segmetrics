- id: openapi
  name: OpenAPI
  conforms: false
  evidence: >-
    No OpenAPI/Swagger document served at any probed path on segmetrics.io, api.segmetrics.io,
    import.segmetrics.io, app.segmetrics.io, docs.segmetrics.io or developers.segmetrics.io.
    The reference at developers.segmetrics.io is Slate-rendered prose (source repo
