  conforms: false with their own wording rather than left blank.
standards:
- id: mcp
  name: Model Context Protocol
  conforms: true
  evidence: >-
    Hosted remote MCP server documented at https://app.segmetrics.io/mcp/ACCOUNT_ID with 11
    named tools and OAuth authorization; documented as working with "any AI tool that supports
    the Model Context Protocol".
  source: https://docs.segmetrics.io/article/672-mcp-server
- id: oauth2
  name: OAuth 2.0
  conforms: partial
  evidence: >-
    OAuth is used to authorize the MCP connection, but no authorization/token endpoints, no
    scope reference, and no RFC 8414 or RFC 9728 metadata are published. Cannot be verified
    beyond the provider's description.
  source: https://docs.segmetrics.io/article/672-mcp-server
- id: oidc
  name: OpenID Connect
  conforms: false
  evidence: /.well-known/openid-configuration returned 404 on every SegMetrics host.
- id: rfc9457-problem-details
  name: RFC 9457 Problem Details
  conforms: false
  evidence: >-
    Errors use a proprietary {"status":"error","errors":[...]} envelope with no type URI and no
    application/problem+json media type.
  source: https://developers.segmetrics.io/#responses
- id: rfc9116-security-txt
  name: RFC 9116 security.txt
  conforms: false
  evidence: /.well-known/security.txt returned 404 on every host, despite a published security contact.
- id: rfc8594-sunset
  name: RFC 8594 Sunset header
  conforms: false
  evidence: No deprecation policy or Sunset/Deprecation header support is published.
- id: rfc9116-rate-limit-headers
  name: RateLimit header fields
  conforms: false
